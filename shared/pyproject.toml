[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-contracts"
version = "1.0.0"
description = "Shared data contracts (Pydantic models) for the Mini AI Interviewer services."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["contracts*"]
